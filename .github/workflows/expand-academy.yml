name: Publish academy source

on:
  push:
    paths:
      - '.github/workflows/expand-academy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and expand the release archive
        shell: python
        run: |
          import base64
          import shutil
          import zipfile
          from pathlib import Path

          repo = Path.cwd()
          parts = sorted((repo / '.bootstrap').glob('ml_part*.b64'))
          if not parts:
              raise SystemExit('No ML archive parts found in .bootstrap')

          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          archive = Path('/tmp/ai-ml-academy.zip')
          archive.write_bytes(base64.b64decode(encoded))

          extract = Path('/tmp/ai-ml-academy-extract')
          if extract.exists():
              shutil.rmtree(extract)
          extract.mkdir(parents=True)
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(extract)

          source = extract / 'AI-ML-Engineering-Academy'
          if not source.is_dir():
              raise SystemExit('Expected academy root was not found in archive')

          for item in list(repo.iterdir()):
              if item.name == '.git':
                  continue
              if item.is_dir():
                  shutil.rmtree(item)
              else:
                  item.unlink()

          for item in source.iterdir():
              target = repo / item.name
              if item.is_dir():
                  shutil.copytree(item, target)
              else:
                  shutil.copy2(item, target)

      - name: Commit published academy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish AI/ML Engineering Academy v1.0"
          git push origin HEAD:main
