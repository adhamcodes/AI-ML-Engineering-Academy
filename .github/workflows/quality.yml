name: Academy quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ml-academy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate academy structure and links
        run: python scripts/validate_academy.py
      - name: Run dependency-free lab smoke tests
        run: python scripts/run_smoke_tests.py

  framework-labs:
    name: Framework lab red-team / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-labs.txt
      - name: Install lab dependencies
        run: python -m pip install -r requirements-labs.txt
      - name: Run framework-level lab gates
        run: python scripts/run_framework_tests.py
