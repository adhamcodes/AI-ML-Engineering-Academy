name: Academy quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ml-academy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate academy structure and links
        run: python scripts/validate_academy.py
      - name: Run dependency-free lab smoke tests
        run: python scripts/run_smoke_tests.py

  framework-labs:
    name: Framework lab red-team / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-labs.txt
      - name: Install lab dependencies
        run: python -m pip install -r requirements-labs.txt
      - name: Run framework-level lab gates
        run: python scripts/run_framework_tests.py

  mlops-container:
    name: Build and boot MLOps service container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build image
        run: docker build -t mlops-lab labs/mlops_service
      - name: Start container
        run: docker run -d --name mlops-lab -p 8090:8090 mlops-lab
      - name: Verify health and prediction endpoints
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          last_error = None
          for _ in range(20):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8090/health", timeout=2) as response:
                      body = json.loads(response.read())
                      assert response.status == 200, response.status
                      assert body["status"] == "ok", body
                      assert body["model_version"], body
                  request = urllib.request.Request(
                      "http://127.0.0.1:8090/predict",
                      data=json.dumps({"x": 3}).encode(),
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(request, timeout=2) as response:
                      body = json.loads(response.read())
                      assert response.status == 200, response.status
                      assert body["prediction"] == 7.0, body
                      assert body["model_version"], body
                  print("MLOPS CONTAINER: PASS")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.5)
          else:
              raise SystemExit(f"container never became healthy: {last_error}")
          PY
      - name: Clean up container
        if: always()
        run: docker rm -f mlops-lab || true
