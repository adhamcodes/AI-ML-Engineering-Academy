name: Academy quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ml-academy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate academy structure and links
        run: python scripts/validate_academy.py
      - name: Run dependency-free lab smoke tests
        run: python scripts/run_smoke_tests.py
